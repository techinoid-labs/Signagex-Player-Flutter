name: CI

# Static analysis + tests on every push and PR. This is the verification the
# player has been missing: the only prior automated job (build-windows.yml)
# packaged Windows but never ran the analyzer or a test, so broken Dart could
# ship. `flutter analyze` here compiles all of lib/, catching real errors before
# merge; `flutter test` runs the (small) test suite.
on:
  push:
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # W25: pinned to a specific release, not the moving "stable" channel --
      # a channel pin means the exact Flutter/Dart toolchain a build uses can
      # change between two runs of identical source with nobody deciding
      # that on purpose. Bump this deliberately (with a commit) when the
      # team is ready to move, never let it drift silently.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      # W25: pubspec.lock should be committed (see .gitignore) so dependency
      # resolution is byte-for-byte reproducible between CI runs and dev
      # machines -- "rebuilding the same source" must mean the same
      # dependency versions too, not just the same pubspec.yaml constraints.
      # This is a warning, not a hard failure: no machine with a Flutter
      # toolchain was available when this pipeline was authored, so no one
      # has actually generated and committed the initial pubspec.lock yet.
      # Once it exists, flip this (and the matching --enforce-lockfile below)
      # back to a hard gate so it can't silently go stale or get deleted.
      - name: Check whether pubspec.lock is tracked
        run: |
          if [ ! -f pubspec.lock ]; then
            echo "::warning::pubspec.lock is missing. Run 'flutter pub get' locally and commit the generated pubspec.lock so dependency resolution is reproducible instead of re-resolved fresh on every run. Not failing the build yet because no lock file has been generated for this repo at all -- once one is committed, make this check (and 'flutter pub get --enforce-lockfile' below) fail again on drift."
          fi

      - name: Install dependencies
        run: flutter pub get

      # Fail the build only on ERRORS (compile-breaking issues), not on the
      # existing warning/info lint debt -- otherwise this would be red from day
      # one and get ignored. Ratchet toward fatal warnings once the backlog is
      # cleared.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
