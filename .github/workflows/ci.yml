name: CI

# Static analysis + tests on every push and PR. This is the verification the
# player has been missing: the only prior automated job (build-windows.yml)
# packaged Windows but never ran the analyzer or a test, so broken Dart could
# ship. `flutter analyze` here compiles all of lib/, catching real errors before
# merge; `flutter test` runs the (small) test suite.
on:
  push:
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # W25: pinned to a specific release, not the moving "stable" channel --
      # a channel pin means the exact Flutter/Dart toolchain a build uses can
      # change between two runs of identical source with nobody deciding
      # that on purpose. Bump this deliberately (with a commit) when the
      # team is ready to move, never let it drift silently.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      # W25: pubspec.lock must be committed (see .gitignore) so dependency
      # resolution is byte-for-byte reproducible between CI runs and dev
      # machines -- "rebuilding the same source" must mean the same
      # dependency versions too, not just the same pubspec.yaml constraints.
      - name: Verify pubspec.lock is tracked
        run: |
          if [ ! -f pubspec.lock ]; then
            echo "::error::pubspec.lock is missing. Run 'flutter pub get' locally and commit the generated pubspec.lock -- dependency resolution must be reproducible, not re-resolved fresh on every CI run."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Fail the build only on ERRORS (compile-breaking issues), not on the
      # existing warning/info lint debt -- otherwise this would be red from day
      # one and get ignored. Ratchet toward fatal warnings once the backlog is
      # cleared.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
