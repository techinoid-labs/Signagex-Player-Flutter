name: Promote Linux to production

# Releasing to customers is a deliberate act, not a side effect of pushing.
#
# Every push publishes to the STAGING feed (build-linux.yml). Production is
# promoted from here, by hand, once that build has actually been tested.
#
# This promotes an EXISTING build rather than rebuilding. Rebuilding from the
# same commit would produce a different binary from the one that was tested,
# which defeats the point of having tested it.

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Target architecture feed
        type: choice
        options: [amd64, arm64]
        default: amd64
      run_id:
        description: "Run id of the Build Linux run to promote (from its URL). Its staging build should already have been tested."
        required: true
        type: string
      confirm:
        description: 'Type "release" to confirm this goes to customers'
        required: true
        type: string

jobs:
  promote-arm64:
    permissions:
      contents: read
      actions: read
    if: inputs.architecture == 'arm64'
    uses: ./.github/workflows/promote-production-arm64.yml
    with:
      run_id: ${{ inputs.run_id }}
      confirm: ${{ inputs.confirm }}
    secrets: inherit
  promote:
    if: inputs.architecture != 'arm64'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: production-amd64-release
      cancel-in-progress: false
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "release" ]; then
            echo "::error::Confirmation not given. Type 'release' to promote this build to customers."
            exit 1
          fi

      # GitHub runs the copy of this file on the ref it is dispatched from.
      # Only the linux branch's copy is the reviewed release process.
      - name: Require the linux branch's workflow
        run: |
          if [ "$GITHUB_REF" != "refs/heads/linux" ]; then
            echo "::error::Run this workflow from the linux branch (Use workflow from: linux), not $GITHUB_REF."
            exit 1
          fi

      # Only a green push build of linux has passed the tests and been on
      # staging. A feature-branch run, or one whose tests failed, still
      # uploads a production-named package, so the artifact alone proves
      # nothing.
      - name: Require a successful linux build as the source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          read -r path branch event conclusion < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            -q '[.path, .head_branch, .event, .conclusion] | @tsv')
          echo "Run $RUN_ID: $path on $branch ($event) -> $conclusion"
          test "$path" = .github/workflows/build-linux.yml || { echo "::error::Run $RUN_ID is not a Build Linux run."; exit 1; }
          test "$branch" = linux || { echo "::error::Run $RUN_ID built $branch, not linux."; exit 1; }
          test "$event" = push || { echo "::error::Run $RUN_ID was $event, not a push to linux."; exit 1; }
          test "$conclusion" = success || { echo "::error::Run $RUN_ID concluded $conclusion; promote only a fully green build."; exit 1; }

      - name: Download build identity from the chosen run
        uses: actions/download-artifact@v4
        with:
          name: build-identity
          path: identity
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the production package from the chosen run
        uses: actions/download-artifact@v4
        with:
          name: signagex-player-deb
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and record what is being promoted
        run: |
          set -euo pipefail
          packages=(dist/signagex-player_*_amd64.deb)
          test "${#packages[@]}" = 1
          deb="${packages[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = signagex-player
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          build_id="$(cat identity/build_id.txt)"
          commit="$(cat identity/commit.txt)"
          # Register the package's own Version ("15"), not the build id ("v15"):
          # the on-device updater compares this with dpkg.
          version="$(dpkg-deb -f "$deb" Version)"
          test "v$version" = "$build_id" || { echo "::error::Package version $version does not match build $build_id."; exit 1; }
          checksum="$(sha256sum "$deb" | cut -d' ' -f1)"
          {
            echo "deb=$deb"
            echo "version=$version"
            echo "checksum=$checksum"
            echo "build_id=$build_id"
          } >> "$GITHUB_ENV"
          echo "Promoting $build_id (commit $commit, sha256 $checksum) from run ${{ inputs.run_id }}."
          {
            echo "### Promoted Linux to production"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Build | \`$build_id\` |"
            echo "| Commit | \`$commit\` |"
            echo "| SHA-256 | \`$checksum\` |"
            echo "| Source run | [${{ inputs.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}) |"
            echo "| Promoted by | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish production package
        env:
          RELEASE_KEY: ${{ secrets.PLAYER_RELEASE_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::PLAYER_RELEASE_UPLOAD_KEY is not set, so nothing can be published."
            exit 1
          fi
          # Strict, unlike the staging publish: if this fails, nothing reached
          # the fleet and the run must say so.
          curl --fail-with-body --silent --show-error -X POST "https://api.signagex.ai/v1/player-releases/upload" \
            -H "x-release-key: $RELEASE_KEY" \
            -F "platform=linux" \
            -F "version=$version" \
            -F "file=@$deb"
          echo
          echo "Production package published as $version (build $build_id)."

      # Devices read the feed on api.signagex.ai (update-channel.json), not
      # the upload response, so that is what must serve this exact package.
      - name: Confirm the device feed serves it
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'https://api.signagex.ai/v1/player-releases/latest?platform=linux' > feed.json
          python3 - "$version" "$checksum" <<'PY'
          import json, sys
          feed = json.load(open('feed.json'))
          assert feed.get('version') == sys.argv[1], f"feed serves {feed.get('version')!r}, expected {sys.argv[1]!r}"
          assert feed.get('sha256') == sys.argv[2], f"feed sha256 {feed.get('sha256')!r} does not match the promoted package"
          print('Production linux feed verified:', feed['version'], feed['sha256'])
          PY
