name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [windows]

jobs:
  # W25: promotion (the actual publish to player-releases, which devices
  # poll and auto-update from) must be gated on the same checks CI runs --
  # otherwise a commit that builds fine but fails a behavioral test can
  # still reach the update feed before anyone sees red. This job mirrors
  # ci.yml's checks so `package`/`promote` below can require it via `needs:`
  # for this exact commit, in this exact workflow run -- no cross-workflow
  # race between two separately-triggered workflows.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See the matching note on the package job's flutter-action step below --
      # bumped from 3.24.5 to the actual current stable release after CI
      # failed with a CMake "Visual Studio 16 2019 could not find any
      # instance" error, caused by the 2-year-old pin's VS-version detection
      # falling behind windows-latest's actual current Visual Studio version.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'

      # W25: see the matching note in ci.yml -- this is a warning, not a hard
      # failure, until an initial pubspec.lock has actually been generated
      # (by someone with a local Flutter toolchain) and committed.
      - name: Check whether pubspec.lock is tracked
        run: |
          if [ ! -f pubspec.lock ]; then
            echo "::warning::pubspec.lock is missing. Run 'flutter pub get' locally and commit the generated pubspec.lock so dependency resolution is reproducible."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

  # Always builds and uploads artifacts regardless of `test` -- a failing
  # commit's build output is still useful to inspect/debug. What `test`
  # actually gates is `promote` below, not this.
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Was 3.24.5 (Sept 2024) -- this job's own CI run failed with "CMake
      # Error at CMakeLists.txt:3 (project): Generator Visual Studio 16 2019
      # could not find any instance of Visual Studio." flutter_tools' Visual
      # Studio detection needs periodic updates for each new VS release
      # (Flutter tracks this as ongoing work -- e.g. flutter/flutter#176399,
      # "Add Support for VisualStudio 2026"); the 2-year-old pin had fallen
      # behind whatever VS version windows-latest actually runs now and
      # requested a generator that isn't there. Bumped to the actual current
      # stable release (verified directly against flutter_infra_release's
      # own releases_windows.json, not guessed), which is necessarily built
      # and tested against today's supported CI images.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'

      - name: Check whether pubspec.lock is tracked
        shell: bash
        run: |
          if [ ! -f pubspec.lock ]; then
            echo "::warning::pubspec.lock is missing. Run 'flutter pub get' locally and commit the generated pubspec.lock so dependency resolution is reproducible."
          fi

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # The in-app webview (flutter_inappwebview) needs the Edge WebView2
      # runtime. A fresh Windows machine may not have it, which makes the webview
      # plugin DLL fail to load at launch ("Bad Image"). Bundle a WebView2 runtime
      # installer into setup.exe; setup.iss runs it per-user (no admin) only when
      # the runtime is missing.
      #
      #   ONLINE (default): the tiny Evergreen *bootstrapper* -- it downloads the
      #     runtime at install time, so the target needs internet during setup.
      #   OFFLINE (kiosk): set a repo variable WEBVIEW2_INSTALLER_URL to a pinned
      #     Evergreen *Standalone* Installer (x64) URL; the produced setup.exe then
      #     installs WebView2 with no internet (adds ~130 MB). Get the URL from
      #     https://developer.microsoft.com/microsoft-edge/webview2/ -> "Evergreen
      #     Standalone Installer" (x64), and pin a specific version for reproducible
      #     kiosk builds. Both installers accept the same "/silent /install" args,
      #     so setup.iss needs no change.
      - name: Fetch WebView2 installer (bundled into setup.exe)
        shell: pwsh
        env:
          WEBVIEW2_INSTALLER_URL: ${{ vars.WEBVIEW2_INSTALLER_URL || 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' }}
        run: |
          Write-Host "Downloading WebView2 installer from $env:WEBVIEW2_INSTALLER_URL"
          Invoke-WebRequest -Uri "$env:WEBVIEW2_INSTALLER_URL" -OutFile "windows\installer\MicrosoftEdgeWebview2Setup.exe"
          $sz = (Get-Item "windows\installer\MicrosoftEdgeWebview2Setup.exe").Length
          Write-Host ("WebView2 installer size: {0:N1} MB" -f ($sz/1MB))

      # Feeds the in-app update check (lib/services/update_check_service.dart)
      # -- the running app compares this against whatever player-releases
      # reports as latest. Uses the workflow's own run number (v1, v2, v3...)
      # rather than a git SHA: this branch ships many small fixes without a
      # manual version-bump step, and run_number is guaranteed unique,
      # increasing, and human-readable with no process to remember.
      - name: Compute build id
        id: build_id
        shell: bash
        run: echo "id=v${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build production
        run: flutter build windows --release --dart-define=APP_BUILD_ID=${{ steps.build_id.outputs.id }}

      # Ship the Visual C++ runtime app-local, next to the exe. The native
      # webview plugin (flutter_inappwebview_windows_plugin.dll) links against
      # the MSVC runtime; on a clean Windows box without the VC++ redistributable
      # the DLL fails to load ("Bad Image"). App-local DLLs need no admin (matches
      # the per-user, no-UAC installer) and no separate vc_redist on the target.
      - name: Bundle VC++ runtime app-local (production)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "VC++ CRT redist folder not found under $vs" }
          Write-Host "Copying VC++ CRT runtime from $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" "build\windows\x64\runner\Release\" -Force
          Get-ChildItem "build\windows\x64\runner\Release\*140*.dll" | Select-Object -ExpandProperty Name

      - name: Package production build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath digital_signage-production.zip

      - name: Build production installer
        run: iscc windows\installer\setup.iss /DOutputBaseFilename=SignageX-Player-Setup

      - name: Build staging
        run: flutter build windows --release --dart-define=APP_ENV=staging --dart-define=APP_BUILD_ID=${{ steps.build_id.outputs.id }}

      # Re-copy the app-local VC++ runtime: the staging build regenerated the
      # Release folder, dropping the DLLs added after the production build.
      - name: Bundle VC++ runtime app-local (staging)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "VC++ CRT redist folder not found under $vs" }
          Copy-Item "$($crt.FullName)\*.dll" "build\windows\x64\runner\Release\" -Force

      - name: Package staging build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath digital_signage-staging.zip

      - name: Build staging installer
        run: iscc windows\installer\setup.iss "/DAppSuffix= (Staging)" /DOutputBaseFilename=SignageX-Player-Setup-Staging

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: digital_signage-production
          path: digital_signage-production.zip

      - name: Upload staging build
        uses: actions/upload-artifact@v4
        with:
          name: digital_signage-staging
          path: digital_signage-staging.zip

      - name: Upload production installer
        uses: actions/upload-artifact@v4
        with:
          name: SignageX-Player-Setup
          path: dist\SignageX-Player-Setup.exe

      - name: Upload staging installer
        uses: actions/upload-artifact@v4
        with:
          name: SignageX-Player-Setup-Staging
          path: dist\SignageX-Player-Setup-Staging.exe

      # Records exactly what this artifact was built from, for the identity
      # check `promote` performs below (W25: "the promoted artifact's
      # identity matches the tested commit").
      - name: Record build identity
        shell: bash
        run: |
          mkdir -p identity
          echo "${{ github.sha }}" > identity/commit.txt
          echo "${{ steps.build_id.outputs.id }}" > identity/build_id.txt

      - name: Upload build identity
        uses: actions/upload-artifact@v4
        with:
          name: build-identity
          path: identity/

  # W25: the actual promotion to player-releases -- what the in-app update
  # banner and any device polling /latest sees. Split from `package` above
  # and gated on `test` passing for this same commit, so a green `package`
  # (compiles, packages) can never alone put an untested build in front of
  # devices. continue-on-error is intentionally NOT used here: an upload
  # that genuinely fails must show as a failed job, not a silently-green
  # one. The one non-failing exit (missing secret) is a deliberate skip,
  # logged as a warning, not a swallowed failure.
  promote:
    needs: [test, package]
    if: github.ref == 'refs/heads/windows'
    runs-on: ubuntu-latest
    steps:
      - name: Download build identity
        uses: actions/download-artifact@v4
        with:
          name: build-identity
          path: identity

      - name: Verify promoted artifact identity matches the tested commit
        shell: bash
        run: |
          recorded_sha="$(cat identity/commit.txt)"
          if [ "$recorded_sha" != "${{ github.sha }}" ]; then
            echo "::error::Artifact identity mismatch: built from $recorded_sha, promoting for ${{ github.sha }}."
            exit 1
          fi
          echo "build_id=$(cat identity/build_id.txt)" >> "$GITHUB_ENV"

      - name: Download production installer
        uses: actions/download-artifact@v4
        with:
          name: SignageX-Player-Setup
          path: dist

      - name: Download staging installer
        uses: actions/download-artifact@v4
        with:
          name: SignageX-Player-Setup-Staging
          path: dist

      - name: Publish production installer for player auto-update
        # Uploads to signageX-backend's player-releases module -- the stable
        # public download URL, and what the in-app "update available" banner
        # polls. Needs PLAYER_RELEASE_UPLOAD_KEY set as a secret here AND as
        # the same value in that backend's own environment.
        shell: bash
        env:
          RELEASE_KEY: ${{ secrets.PLAYER_RELEASE_UPLOAD_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::warning::PLAYER_RELEASE_UPLOAD_KEY secret not set -- skipping publish to player-releases (in-app auto-update won't see this build). This is a deliberate skip, not a failure."
            exit 0
          fi
          curl -sf -X POST "https://signagexai.com/v1/player-releases/upload" \
            -H "x-release-key: $RELEASE_KEY" \
            -F "platform=windows" \
            -F "version=$build_id" \
            -F "file=@dist/SignageX-Player-Setup.exe"

      - name: Publish staging installer for player auto-update
        # Same idea as the production publish step above, but against
        # stage.signagexai.com -- a staging-built app's own apiHost (see
        # lib/utils/constants.dart) points there, so this is what lets the
        # whole CI -> backend -> in-app update banner loop be tested for
        # real on staging before anything touches production.
        shell: bash
        env:
          RELEASE_KEY: ${{ secrets.PLAYER_RELEASE_UPLOAD_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::warning::PLAYER_RELEASE_UPLOAD_KEY secret not set -- skipping staging publish to player-releases. This is a deliberate skip, not a failure."
            exit 0
          fi
          # Never fails the job. The production installer is published by the
          # step above and has already succeeded by the time this runs, so a
          # staging problem must not mark a shipped production release as a
          # failed build -- customers are only ever given production builds.
          #
          # This is not hypothetical: run #142 went red here while the upload
          # had in fact worked, with stage.signagexai.com serving that exact
          # version afterwards. curl reported failure after the server had
          # accepted a 44 MB upload, so the step is also inherently prone to
          # reporting a failure that did not happen.
          if curl -sf -X POST "https://stage.signagexai.com/v1/player-releases/upload" \
            -H "x-release-key: $RELEASE_KEY" \
            -F "platform=windows" \
            -F "version=$build_id" \
            -F "file=@dist/SignageX-Player-Setup-Staging.exe"; then
            echo "Staging installer published."
          else
            echo "::warning::Staging publish to player-releases failed (exit $?). The production release above succeeded and is unaffected. Check stage.signagexai.com if the staging update loop is needed."
          fi
