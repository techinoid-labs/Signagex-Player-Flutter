name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [windows]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # The in-app webview (flutter_inappwebview) needs the Edge WebView2
      # runtime. A fresh Windows machine may not have it, which makes the webview
      # plugin DLL fail to load at launch ("Bad Image"). Bundle a WebView2 runtime
      # installer into setup.exe; setup.iss runs it per-user (no admin) only when
      # the runtime is missing.
      #
      #   ONLINE (default): the tiny Evergreen *bootstrapper* -- it downloads the
      #     runtime at install time, so the target needs internet during setup.
      #   OFFLINE (kiosk): set a repo variable WEBVIEW2_INSTALLER_URL to a pinned
      #     Evergreen *Standalone* Installer (x64) URL; the produced setup.exe then
      #     installs WebView2 with no internet (adds ~130 MB). Get the URL from
      #     https://developer.microsoft.com/microsoft-edge/webview2/ -> "Evergreen
      #     Standalone Installer" (x64), and pin a specific version for reproducible
      #     kiosk builds. Both installers accept the same "/silent /install" args,
      #     so setup.iss needs no change.
      - name: Fetch WebView2 installer (bundled into setup.exe)
        shell: pwsh
        env:
          WEBVIEW2_INSTALLER_URL: ${{ vars.WEBVIEW2_INSTALLER_URL || 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' }}
        run: |
          Write-Host "Downloading WebView2 installer from $env:WEBVIEW2_INSTALLER_URL"
          Invoke-WebRequest -Uri "$env:WEBVIEW2_INSTALLER_URL" -OutFile "windows\installer\MicrosoftEdgeWebview2Setup.exe"
          $sz = (Get-Item "windows\installer\MicrosoftEdgeWebview2Setup.exe").Length
          Write-Host ("WebView2 installer size: {0:N1} MB" -f ($sz/1MB))

      # Feeds the in-app update check (lib/services/update_check_service.dart)
      # -- the running app compares this against whatever player-releases
      # reports as latest. Uses the workflow's own run number (v1, v2, v3...)
      # rather than a git SHA: this branch ships many small fixes without a
      # manual version-bump step, and run_number is guaranteed unique,
      # increasing, and human-readable with no process to remember.
      - name: Compute build id
        id: build_id
        shell: bash
        run: echo "id=v${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build production
        run: flutter build windows --release --dart-define=APP_BUILD_ID=${{ steps.build_id.outputs.id }}

      # Ship the Visual C++ runtime app-local, next to the exe. The native
      # webview plugin (flutter_inappwebview_windows_plugin.dll) links against
      # the MSVC runtime; on a clean Windows box without the VC++ redistributable
      # the DLL fails to load ("Bad Image"). App-local DLLs need no admin (matches
      # the per-user, no-UAC installer) and no separate vc_redist on the target.
      - name: Bundle VC++ runtime app-local (production)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "VC++ CRT redist folder not found under $vs" }
          Write-Host "Copying VC++ CRT runtime from $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" "build\windows\x64\runner\Release\" -Force
          Get-ChildItem "build\windows\x64\runner\Release\*140*.dll" | Select-Object -ExpandProperty Name

      - name: Package production build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath digital_signage-production.zip

      - name: Build production installer
        run: iscc windows\installer\setup.iss /DOutputBaseFilename=SignageX-Player-Setup

      - name: Publish production installer for player auto-update
        # Uploads to signageX-backend's player-releases module -- the stable
        # public download URL, and what the in-app "update available" banner
        # polls. Needs PLAYER_RELEASE_UPLOAD_KEY set as a secret here AND as
        # the same value in that backend's own environment; continue-on-error
        # so a publish failure (e.g. the secret not set up yet) can't block
        # the installer artifact this workflow already produces below.
        continue-on-error: true
        shell: bash
        env:
          RELEASE_KEY: ${{ secrets.PLAYER_RELEASE_UPLOAD_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::warning::PLAYER_RELEASE_UPLOAD_KEY secret not set -- skipping publish to player-releases (in-app auto-update won't see this build)."
            exit 0
          fi
          curl -sf -X POST "https://signagexai.com/v1/player-releases/upload" \
            -H "x-release-key: $RELEASE_KEY" \
            -F "platform=windows" \
            -F "version=${{ steps.build_id.outputs.id }}" \
            -F "file=@dist/SignageX-Player-Setup.exe"

      - name: Build staging
        run: flutter build windows --release --dart-define=APP_ENV=staging --dart-define=APP_BUILD_ID=${{ steps.build_id.outputs.id }}

      # Re-copy the app-local VC++ runtime: the staging build regenerated the
      # Release folder, dropping the DLLs added after the production build.
      - name: Bundle VC++ runtime app-local (staging)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "VC++ CRT redist folder not found under $vs" }
          Copy-Item "$($crt.FullName)\*.dll" "build\windows\x64\runner\Release\" -Force

      - name: Package staging build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath digital_signage-staging.zip

      - name: Build staging installer
        run: iscc windows\installer\setup.iss "/DAppSuffix= (Staging)" /DOutputBaseFilename=SignageX-Player-Setup-Staging

      - name: Publish staging installer for player auto-update
        # Same idea as the production publish step above, but against
        # stage.signagexai.com -- a staging-built app's own apiHost (see
        # lib/utils/constants.dart) points there, so this is what lets the
        # whole CI -> backend -> in-app update banner loop be tested for
        # real on staging before anything touches production.
        continue-on-error: true
        shell: bash
        env:
          RELEASE_KEY: ${{ secrets.PLAYER_RELEASE_UPLOAD_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::warning::PLAYER_RELEASE_UPLOAD_KEY secret not set -- skipping staging publish to player-releases."
            exit 0
          fi
          curl -sf -X POST "https://stage.signagexai.com/v1/player-releases/upload" \
            -H "x-release-key: $RELEASE_KEY" \
            -F "platform=windows" \
            -F "version=${{ steps.build_id.outputs.id }}" \
            -F "file=@dist/SignageX-Player-Setup-Staging.exe"

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: digital_signage-production
          path: digital_signage-production.zip

      - name: Upload staging build
        uses: actions/upload-artifact@v4
        with:
          name: digital_signage-staging
          path: digital_signage-staging.zip

      - name: Upload production installer
        uses: actions/upload-artifact@v4
        with:
          name: SignageX-Player-Setup
          path: dist\SignageX-Player-Setup.exe

      - name: Upload staging installer
        uses: actions/upload-artifact@v4
        with:
          name: SignageX-Player-Setup-Staging
          path: dist\SignageX-Player-Setup-Staging.exe
