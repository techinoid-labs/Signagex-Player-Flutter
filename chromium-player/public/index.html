<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SignageX Player</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="pairing-screen" class="screen">
    <div class="pairing-card">
      <h1>Pair this screen</h1>
      <p>Enter this code in the SignageX dashboard to pair it.</p>
      <div id="pairing-code" class="pairing-code">------</div>
      <p class="status" id="pairing-status">Contacting server&hellip;</p>
    </div>
  </div>

  <div id="player-screen" class="screen hidden">
    <div id="content-root"></div>
    <div id="no-content" class="no-content">
      <h2>No content to display</h2>
      <p>This screen is paired but no campaign has been assigned/pushed yet.</p>
    </div>
  </div>

  <div id="blank-chrome-overlay" class="hidden">
    <div class="fake-toolbar">
      <div class="fake-nav-btn">&larr;</div>
      <div class="fake-nav-btn">&rarr;</div>
      <div class="fake-address-bar"></div>
    </div>
  </div>

  <script src="/vendor/mqtt/mqtt.min.js"></script>
  <script src="/vendor/html2canvas/html2canvas.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
